<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>棉棉兔記帳｜共享帳本邀請</title>
<link rel="apple-touch-icon" href="../img/avatar.png">
<link rel="icon" href="../img/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root{
  --bg:#fcf4e6;--card:#fffaf1;--ink:#5a3826;--mute:#8f6f5c;--line:#5a3826;--cta:#f0a08e;--cta-ink:#4a2a1c;--link:#a2553a;
  --shadow:4px 4px 0 var(--line);--bw:2.5px;--r:22px;
  --hand:"LXGW WenKai TC","Huninn","PingFang TC","Hiragino Sans",serif;--ui:"Huninn","PingFang TC","PingFang SC","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0806;--card:rgba(24,19,15,.80);--ink:#FFF3E3;--mute:rgba(255,243,227,.62);--line:rgba(255,236,214,.13);--cta:#FFC27A;--cta-ink:#2B1A12;--link:#FFC27A;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8),0 0 0 1px rgba(243,234,240,.08) inset;--bw:1px;--r:24px;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.7}
.card{width:100%;max-width:380px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 24px 24px;text-align:center}
.bun{width:96px;height:96px;border-radius:50%;display:block;margin:0 auto 12px}
h1{font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.4;margin:0 0 6px;text-wrap:balance}
.ledger{font-family:var(--hand);font-size:26px;font-weight:700;margin:4px 0 18px;word-break:break-word}
.btn{display:block;width:100%;padding:14px 16px;border:var(--bw) solid var(--line);border-radius:999px;background:var(--cta);color:var(--cta-ink);font:700 17px/1.3 var(--ui);text-decoration:none;box-shadow:3px 3px 0 var(--line);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.note{color:var(--mute);font-size:13px;margin:16px 0 0}
.note a{color:var(--link)}
.bad{color:var(--mute);margin:8px 0 0}
/* 不停留：先只放兔子和一行「正在打開」，App 沒打開（沒裝、被瀏覽器擋）才顯示整張卡 */
.opening{display:grid;place-items:center;gap:10px;color:var(--mute);font-size:15px}
.opening .bun{width:72px;height:72px;margin:0;animation:hop 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card{animation:rise .35s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.opening .bun,.card{animation:none}}
</style>
</head>
<body>
<div class="opening" id="opening"><img class="bun" src="../img/avatar.png" alt=""><span id="openingText"></span></div>
<main class="card" id="card" hidden>
  <img class="bun" src="../img/avatar.png" alt="">
  <h1 id="title"></h1>
  <div class="ledger" id="ledger"></div>
  <a class="btn" id="open" href="#"></a>
  <p class="note"><span id="noapp"></span> <a id="get" href="../"></a></p>
</main>
<script>
(function () {
  var T = {
    'zh-Hant': { opening: '正在打開棉棉兔記帳…', title: '{o}邀請你一起記帳', anon: '有人', open: '用棉棉兔記帳打開', noapp: '還沒有 App？', get: '下載棉棉兔記帳', bad: '這個邀請連結不完整，請對方重新傳一次。' },
    'zh-Hans': { opening: '正在打开棉棉兔记账…', title: '{o}邀请你一起记账', anon: '有人', open: '用棉棉兔记账打开', noapp: '还没有 App？', get: '下载棉棉兔记账', bad: '这个邀请链接不完整，请对方重新发一次。' },
    en: { opening: 'Opening Cotton Budget…', title: '{o} invited you to keep a ledger together', anon: 'Someone', open: 'Open in Cotton Budget', noapp: "Don't have the app?", get: 'Get Cotton Budget', bad: 'This invite link is incomplete. Ask them to send it again.' },
    ja: { opening: 'わたうさ家計簿を開いています…', title: '{o}から一緒に家計簿をつけようと招待が届きました', anon: '誰か', open: 'わたうさ家計簿で開く', noapp: 'アプリをお持ちでない方', get: 'ダウンロード', bad: '招待リンクが不完全です。もう一度送ってもらってください。' },
  };
  var nav = (navigator.languages || [navigator.language || 'zh-Hant']).join(',').toLowerCase();
  var lang = /zh-(hans|cn|sg)/.test(nav) ? 'zh-Hans' : /^zh|,zh/.test(nav) ? 'zh-Hant' : /^ja|,ja/.test(nav) ? 'ja' : /^en|,en/.test(nav) ? 'en' : 'zh-Hant';
  var t = T[lang];
  document.documentElement.lang = lang;

  // 邀請內容放在 # 後面（不會送到網站伺服器）：v 版本、l 帳本、n 帳本名稱、o 邀請人、
  // f 資料夾、g 共用改動檔、s 共用快照（雲端硬碟）、c iCloud 邀請網址（iPhone 邀請才有）。兩種至少要有一種，App 會自己判斷走哪一種。
  var p = new URLSearchParams(location.hash.slice(1));
  var ok = p.get('l') && ((p.get('f') && p.get('g') && p.get('s')) || /^https:\/\/www\.icloud\.com\/share\//.test(p.get('c') || ''));
  var opening = document.getElementById('opening');
  var card = document.getElementById('card');
  document.getElementById('openingText').textContent = t.opening;
  function showCard() { opening.hidden = true; card.hidden = false; }
  var owner = (p.get('o') || '').slice(0, 40);
  document.getElementById('title').textContent = t.title.replace('{o}', owner || t.anon);
  document.getElementById('ledger').textContent = (p.get('n') || '').slice(0, 60);
  document.getElementById('noapp').textContent = t.noapp;
  document.getElementById('get').textContent = t.get;
  var btn = document.getElementById('open');
  btn.textContent = t.open;
  if (!ok) {
    showCard();
    btn.remove();
    var bad = document.createElement('p');
    bad.className = 'bad';
    bad.textContent = t.bad;
    document.getElementById('ledger').after(bad);
    return;
  }
  var query = p.toString();
  var android = /android/i.test(navigator.userAgent);
  var app = android
    ? 'intent://drive-join?' + query + '#Intent;scheme=daak;package=com.yuzuki.howausa;end'
    : 'daak://drive-join?' + query;
  btn.href = app;
  // 不停留：一打開就跳進 App。App 打開後這頁會被切到背景；過了一下還在前面（沒裝 App、被內建瀏覽器擋下）才顯示整張卡，按鈕照樣可以按
  location.href = app;
  setTimeout(function () { if (!document.hidden) showCard(); }, 1600);
  document.addEventListener('visibilitychange', function () {
    // 從 App 回到這頁（例如加入完按返回）：顯示整張卡，不要一直轉圈
    if (!document.hidden) showCard();
  });
})();
</script>
</body>
</html>
